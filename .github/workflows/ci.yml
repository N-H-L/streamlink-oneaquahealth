# Type-check, test and build on every push. The FHIR validation runs separately (needs Java and
# the OAH package); see scripts/validate.sh and out/validation/summary.md.
name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
