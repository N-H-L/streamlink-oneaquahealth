  Profiles, terminology, a Questionnaire and a ConceptMap that let citizen stream checks,
  expert verification, map-based baselines and lab-sampling referrals live in the same
  FHIR record as OneAquaHealth indicators. Hackathon prototype; all examples are demo data.
